<!DOCTYPE html>
<html>
<head>
<title>Easter Egg Hunt 2025</title>
<link rel="stylesheet" type="text/css" href="style.css" />
<script type="text/javascript" src="script.js"></script>
 <script src="https://cdn.tailwindcss.com"></script>
</head>
<body onload="start();"> 


<!-- Indoor image starts off displayed  -->
<img src="indoor.png" style="display:block" id="indoor"  usemap="#indoormap">

<map name="indoormap">
  <area shape="rect" coords="1400,0,1500,1024" alt="Exit" href="javascript:go('outdoor');" style="cursor: url('rightarrow.png'), auto">
  <area shape="rect" coords="50,200,180,350" alt="Photo" href="javascript:display('photodiv', true);" style="cursor: url('glass.png'), auto">
  <area shape="rect" coords="340,270,580,500" alt="Note" href="javascript:display('notediv', true);" style="cursor: url('glass.png'), auto">
  <area shape="rect" coords="380,60,590,265" alt="Conversation" href="javascript:display('indoor-convodiv', true);" style="cursor: url('speech.png'), auto">
</map>

<!-- Answer form modal/toolbar  -->
<img src="form.png" onclick="display('form-modal');" class="toolbar" style="cursor: url('form.png'), auto" id="answerbutton">



<!-- Photo image starts off hidden  -->

 <div id="photodiv" class="modal">
	 <div  class="modal-content" >
		<span class="close" onclick="hide('photodiv')">&times;</span> 
		<img src="photo.png"  id="photo" class="modal-content" width="512px" height="768px">
		<div class="phototext">
			<p>Cherry Tree Primary School, Spring term, 1996</p>
			<p>Deliver to: Ellie Harper, class 6A, Cherry Tree Primary School, Woodley</p>
		</div>
	</div>
</div> 

<!-- Note image starts off hidden  -->

 <div id="notediv" class="modal">
	 <div  class="modal-content" >
		<span class="close" onclick="hide('notediv')">&times;</span> 
		<img src="note.png"  id="note" class="modal-content" width="512px" height="768px">

	</div>
</div> 

<!-- Conversation starts off hidden  -->

 <div id="indoor-convodiv" class="modal">
	 <div  class="modal-content" >
		<span class="close" onclick="hide('indoor-convodiv')">&times;</span> 
		<div class="convotext">
			<p>Convo between</p>
			<p>Linda, Becky, Zara</p>
		</div>
	</div>
</div> 



<!-- Outdoor image starts off hidden -->
<img src="outdoor.png" style="display:none" id="outdoor" usemap="#outdoormap">

<map name="outdoormap">
  <area shape="rect" coords="1040,200,1120,370" alt="Door" href="#" onclick="go('indoor');" style="cursor: url('uparrow.png'), auto">
   <area shape="rect" coords="1400,0,1500,1024" alt="Right" href="javascript:go('road');" style="cursor: url('rightarrow.png'), auto">
</map>

<!-- Road image starts off hidden -->
<img src="road-temp.png" style="display:none" id="road" usemap="#roadmap">  <!-- TODO:update with real road image-->

<map name="roadmap">
 <!-- TODO:decide which direction is which-->
   <area shape="rect" coords="0,0,100,1024" alt="Left" href="javascript:go('outdoor');" style="cursor: url('leftarrow.png'), auto">
    <area shape="rect" coords="1400,0,1500,1024" alt="Right" href="javascript:go('coffeeshop');" style="cursor: url('rightarrow.png'), auto">
</map>

<!-- Coffee shop image starts off hidden -->
<img src="coffeeshop.png" style="display:none" id="coffeeshop" usemap="#coffeemap">

<map name="coffeemap">
 <area shape="rect" coords="0,0,100,1024" alt="Exit" href="javascript:go('road');" style="cursor: url('leftarrow.png'), auto">
  <area shape="rect" coords="600,70,850,400" alt="Orders" href="javascript:display('ordersdiv');" style="cursor: url('glass.png'), auto">
   <area shape="rect" coords="1250,300,1400,500" alt="Rota" href="javascript:display('rotadiv');" style="cursor: url('glass.png'), auto">

</map>

<!-- Coffee orders image starts off hidden  -->
 <div id="ordersdiv" class="modal">
	 <div  class="modal-content" >
		<span class="close" onclick="hide('ordersdiv')">&times;</span> 
		<img src="orders.png"  id="orders" class="modal-content" >
		
	</div>
</div> 

<!-- Coffee rota starts off hidden
TODO: style; right align  -->
 <div id="rotadiv" class="modal">
	 <div  class="modal-content" style="right:0px" >
		<span class="close" onclick="hide('rotadiv')">&times;</span> 
		<div class="rota">
		
		<u>Staff rota</u><br><br>
		Weds 4: Dawn </br>
		Thurs 5: Simon<br>
		Fri 6: Dawn<br>
		Sat 7: Geoff<br>
		<b>Sun 8: closed </b><br>
		Mon 9: Dawn <br>
		Tues 10: Ali<br>
		</div>
		
	</div>
</div>

Make sure to update the cursor when the scene changes; it seems to persist
Remove the shadows from the arrows!
Add actual X to top right of photo and others (or make them (styled) popups??)
Add credits page at end, and move arrow credit and others to there
Fix issues with some Xs on the left
-->

<div id="form-modal" class="modal"> <!-- This bit is the grey overlay that covers everything that's not part of the modal -->
	<div id="form-content" class="modal-content; rounded-xl border-4 border-red-600 bg-gradient-to-tr from-red-500 to-orange-500" > <!-- This is the modal itself -->
		<span class="close" onclick="hide('form-modal')">&times;</span> <!-- Close button X -->
		<table>
		<tr>
		<td>
			<form id="form" class="text-sky-800">
		</form>
		</td>
		<td> </td>
		<td>
		<br>
			<textarea id="notes" rows=12 cols=100 placeholder="Personal notes..." class="rounded-lg border-4 border-red-600 shadow-lg"></textarea>
		</td></tr></table>
	<div>
</div>



<a target="_blank" href="https://icons8.com/icon/11759/arrow">Arrow</a> icon by <a target="_blank" href="https://icons8.com">Icons8</a>
	
</body>
</html>
