<!DOCTYPE html>
<html>
<head>
<title>Easter Egg Hunt 2025</title>
<link rel="stylesheet" type="text/css" href="style.css" />
<script type="text/javascript" src="script.js"></script>
</head>
<body onload="start();"> <!--warning popup if on mobile-->


<!-- Indoor image starts off displayed  -->
<img src="indoor.png" style="display:block" id="indoor"  usemap="#indoormap">

<map name="indoormap">
  <area shape="rect" coords="1400,0,1500,1024" alt="Exit" href="javascript:goOutside();" style="cursor: url('rightarrow.png'), auto">
  <area shape="rect" coords="50,200,150,300" alt="Photo" href="javascript:display('photodiv', true);" style="cursor: url('glass.png'), auto">
</map>

<img src="form.png" onclick="display('form', true);" class="toolbar">



<!-- Photo image starts off hidden 
<img src="photo.png" style="display:none; z-index: 1" id="photo"> -->

 <div id="photodiv" class="modal">
 <div  class="modal-content" width=fit-content>
 <span class="close" onclick="display('photodiv', false)">&times;</span> 
<img src="photo.png"  id="photo" class="modal-content" width="512px" height="768px">
</div>
</div> 



<!-- Outdoor image starts off hidden -->
<img src="outdoor.png" style="display:none" id="outdoor" usemap="#outdoormap">

<map name="outdoormap">
  <area shape="rect" coords="1000,200,1100,350" alt="Door" href="#" onclick="goInside();" style="cursor: url('uparrow.png'), auto">
</map>
